<!DOCTYPE html>
<html lang="fr" data-theme="dark" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeVault — Mes documents</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link rel="stylesheet" href="styles.css">
<script src="theme.js"></script>

</head>
<body class="h-full flex overflow-hidden">

<!-- SIDEBAR -->
<aside class="sv-sidebar w-64 flex flex-col shrink-0 sticky top-0 h-screen z-20 select-none">
  <div class="h-16 flex items-center px-6 gap-3" style="border-bottom:1px solid var(--border-sidebar)">
    <div class="w-9 h-9 rounded-xl sv-icon flex items-center justify-center shrink-0 sv-text-primary">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2l7 3.5v5.5c0 5-3.5 9.5-7 11-3.5-1.5-7-6-7-11V5.5L12 2z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9.5 12a2.5 2.5 0 015 0v1.5H9.5V12z"/></svg>
    </div>
    <div>
      <span class="text-base font-bold tracking-tight block leading-tight sv-text-primary">SafeVault</span>
      <span class="text-[10px] uppercase tracking-wider sv-text-muted font-medium">Cloud Sécurisé</span>
    </div>
  </div>
  <nav class="flex-1 px-4 py-5 space-y-1 overflow-y-auto">
    <a href="index.html" class="sv-nav-item flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-medium transition-all">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
      <span>Accueil</span>
    </a>
    <!-- ACTIF -->
    <a href="documents.html" aria-current="page" class="sv-nav-active flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-semibold transition-all">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
      <span>Mes documents</span>
    </a>
    <a href="deposer.html" class="sv-nav-item flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-medium transition-all">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
      <span>Déposer un fichier</span>
    </a>
    <a href="partager.html" class="sv-nav-item flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-medium transition-all">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
      <span>Partager</span>
    </a>
    <a href="parametres.html" class="sv-nav-item flex items-center gap-3.5 px-4 py-3 rounded-2xl text-sm font-medium transition-all">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
      <span>Paramètres</span>
    </a>
  </nav>
</aside>

<!-- MAIN -->
<div class="flex-1 flex flex-col min-w-0 overflow-hidden">
  <header class="sv-header h-16 px-8 flex items-center justify-end shrink-0 z-10" style="position:sticky;top:0">
    <div class="flex items-center gap-3 px-3 py-1.5 rounded-full sv-card cursor-pointer" style="border:1px solid var(--border-default)">
      <div class="h-8 w-8 rounded-full sv-icon flex items-center justify-center shrink-0 text-[10px] font-black sv-text-primary">OK</div>
      <span class="text-sm font-medium sv-text-primary">Oswald Kds</span>
      <svg class="w-4 h-4 sv-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto p-8 space-y-6">

    <!-- Header -->
    <div class="flex items-center justify-between">
      <h2 class="text-2xl font-bold sv-text-primary">Vos documents</h2>
      <a href="deposer.html" class="sv-btn-primary px-5 py-2.5 rounded-xl text-sm font-semibold flex items-center gap-2 cursor-pointer" style="text-decoration:none">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Ajouter un nouveau
      </a>
    </div>

    <!-- Search Bar -->
    <div class="relative">
      <div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
        <svg class="w-4 h-4 sv-text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 105 11a6 6 0 0012 0z"/>
        </svg>
      </div>
      <input
        id="search-input"
        type="text"
        placeholder="Rechercher votre document…"
        class="sv-input w-full pl-11 pr-4 py-3 rounded-2xl text-sm"
        oninput="filterDocs(this.value)"
      >
      <div id="search-count" class="absolute inset-y-0 right-4 flex items-center">
        <span class="text-xs sv-text-muted font-medium" id="result-count">24 fichiers</span>
      </div>
    </div>

    <!-- Document Grid -->
    <div id="doc-grid" class="grid grid-cols-6 gap-4"></div>
    <p id="no-result" class="hidden text-center sv-text-muted text-sm py-16">Aucun fichier ne correspond à votre recherche.</p>

  </main>
</div>

<style>
.doc-card {
  background: var(--bg-card);
  backdrop-filter: var(--blur-card);
  -webkit-backdrop-filter: var(--blur-card);
  border: 1px solid var(--border-card);
  box-shadow: var(--inset-glow), var(--shadow-card);
  border-radius: 1.25rem;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  cursor: pointer;
  transition: all 0.2s ease;
  text-align: center;
}
.doc-card:hover {
  background: var(--bg-card-hover);
  border-color: var(--border-strong);
  transform: translateY(-2px);
}
.doc-icon-wrap {
  width: 3rem;
  height: 3rem;
  border-radius: 0.875rem;
  background: var(--bg-icon);
  border: 1px solid var(--border-strong);
  box-shadow: var(--shadow-icon);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
}
.doc-ext-label {
  font-size: 9px;
  font-weight: 900;
  color: var(--text-primary);
  text-transform: uppercase;
  line-height: 1;
}
.doc-file-icon {
  color: var(--text-secondary);
}
.doc-name {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
  word-break: break-all;
  line-height: 1.3;
}
.doc-size {
  font-size: 10px;
  color: var(--text-muted);
}
</style>

<script>
const allDocs = [
  { ext:'TXT', name:'nonne.txt',     size:'14 Ko' },
  { ext:'PDF', name:'prime.pdf',     size:'2.4 Mo' },
  { ext:'PDF', name:'techo.pdf',     size:'850 Ko' },
  { ext:'PDF', name:'lteco.pdf',     size:'1.2 Mo' },
  { ext:'DOCX',name:'eli.docx',      size:'340 Ko' },
  { ext:'PPTX',name:'eli.pptx',      size:'4.8 Mo' },
  { ext:'TXT', name:'utf.txt',       size:'8 Ko' },
  { ext:'DOCX',name:'camea.docx',    size:'512 Ko' },
  { ext:'DOT', name:'debo.dot',      size:'120 Ko' },
  { ext:'PDF', name:'dso.pdf',       size:'1.9 Mo' },
  { ext:'PDF', name:'dsra.pdf',      size:'3.1 Mo' },
  { ext:'PDF', name:'diso.pdf',      size:'720 Ko' },
  { ext:'PPTX',name:'eli.pptx',      size:'5.2 Mo' },
  { ext:'PPTX',name:'mora.pptx',     size:'3.9 Mo' },
  { ext:'PDF', name:'mora.pdf',      size:'1.5 Mo' },
  { ext:'TXT', name:'mora.txt',      size:'22 Ko' },
  { ext:'PDF', name:'or.pdf',        size:'640 Ko' },
  { ext:'PPTX',name:'dia.pptx',      size:'8.1 Mo' },
  { ext:'DOCX',name:'telen.docx',    size:'420 Ko' },
  { ext:'PDF', name:'diso.pdf',      size:'1.1 Mo' },
  { ext:'DOCX',name:'eli.docx',      size:'280 Ko' },
  { ext:'PPTX',name:'eco.pptx',      size:'6.7 Mo' },
  { ext:'PDF', name:'tast.pdf',      size:'980 Ko' },
  { ext:'PPTX',name:'camero.pptx',   size:'4.3 Mo' },
];

function filterDocs(query) {
  const q = query.trim().toLowerCase();
  const filtered = q ? allDocs.filter(d => d.name.toLowerCase().includes(q) || d.ext.toLowerCase().includes(q)) : allDocs;
  const grid = document.getElementById('doc-grid');
  const noResult = document.getElementById('no-result');
  const count = document.getElementById('result-count');
  count.textContent = filtered.length + ' fichier' + (filtered.length !== 1 ? 's' : '');
  if (filtered.length === 0) {
    grid.innerHTML = '';
    noResult.classList.remove('hidden');
  } else {
    noResult.classList.add('hidden');
    grid.innerHTML = filtered.map(renderDoc).join('');
  }
}

function renderDoc(d) {
  return `
  <div class="doc-card">
    <div class="doc-icon-wrap">
      <span class="doc-ext-label">${d.ext}</span>
      <svg class="doc-file-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    </div>
    <div>
      <div class="doc-name">${d.name}</div>
      <div class="doc-size">${d.size}</div>
    </div>
  </div>`;
}

const grid = document.getElementById('doc-grid');
grid.innerHTML = allDocs.map(d => `
  <div class="doc-card">
    <div class="doc-icon-wrap">
      <span class="doc-ext-label">${d.ext}</span>
      <svg class="doc-file-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
      </svg>
    </div>
    <div>
      <div class="doc-name">${d.name}</div>
      <div class="doc-size">${d.size}</div>
    </div>
  </div>`).join('');
</script>
</body>
</html>
